{% extends 'base.html' %}
{% block title %}Teachers' Timetables{% endblock %}
{% block content %}
<h2>Teachers' Timetables</h2>
<ul class="list-group">
    {% for t in teachers %}
        <li class="list-group-item d-flex justify-content-between">
            {{ t.name }}
            <a href="{% url 'view_teacher_timetable' t.id %}" class="btn btn-sm btn-primary">View</a>
        </li>
    {% empty %}
        <li>No teachers with timetable entries.</li>
    {% endfor %}
</ul>
<a href="{% url 'timetable_index' %}" class="btn btn-secondary mt-3">Back</a>
{% endblock %}
