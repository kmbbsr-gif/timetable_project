{% extends 'base.html' %}

{% block title %}Rooms Timetable{% endblock %}

{% block content %}
<h2>Room Timetables</h2>
<ul class="list-group">
    {% for room in rooms %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            {{ room.name }} ({{ room.type }})
            <a href="{% url 'view_room_timetable' room.id %}" class="btn btn-sm btn-primary">View</a>
        </li>
    {% empty %}
        <li class="list-group-item">No rooms found.</li>
    {% endfor %}
</ul>
<a href="{% url 'timetable_index' %}" class="btn btn-secondary mt-3">Back</a>
{% endblock %}
