{% extends 'base.html' %}

{% block title %}Delete School{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <i class="bi bi-exclamation-triangle"></i> Confirm Deletion
            </div>
            <div class="card-body">
                <p>Are you sure you want to delete <strong>{{ school.name }}</strong>?</p>
                <p class="text-muted">This action cannot be undone. All associated data will be removed.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    <a href="{% url 'school_detail' school.pk %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
