{% extends 'base.html' %}

{% block title %}{{ view.title|default:"ClassSubject Form" }}{% endblock %}

{% block content %}
<h2>{{ view.title|default:"Assignment" }}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'classsubject_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
