{% extends 'base.html' %}

{% block title %}Delete Session{% endblock %}

{% block content %}
<div class="card border-danger">
    <div class="card-header bg-danger text-white">Confirm Deletion</div>
    <div class="card-body">
        <p>Are you sure you want to delete <strong>{{ session.name }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'session_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
